name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # CGO off so cross-platform builds stay reproducible; the relay is pure Go.
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build -buildvcs=false ./...
      - name: go vet
        run: go vet ./...

  test:
    # Tests are verified on Windows, which is where this relay is developed and
    # measured against real clients. Running them elsewhere is unverified, so it
    # is not claimed here.
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: go test
        run: go test ./...
